services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_JWT_SECRET: ${SECRET_KEY:-change-me-to-a-random-secret-key}
      APP_JWT_EXPIRATION_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      APP_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    volumes:
      - sqlitedata:/app/data

  frontend:
    build: ./frontend
    command: sh -c "npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js

volumes:
  sqlitedata:
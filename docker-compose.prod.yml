services:
  backend:
    image: ghcr.io/reluckylucy/strongtracking-backend:3.0
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_JWT_SECRET: ${SECRET_KEY:-change-me-to-a-random-secret-key}
      APP_JWT_EXPIRATION_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      APP_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    volumes:
      - sqlitedata:/app/data
    restart: unless-stopped

  frontend:
    image: ghcr.io/reluckylucy/strongtracking-frontend:2.0
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlitedata:
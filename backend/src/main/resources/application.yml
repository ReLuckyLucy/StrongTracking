server:
  port: 18735

spring:
  application:
    name: strongtracking
  datasource:
    url: jdbc:sqlite:data/strongtracking.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-to-a-random-secret-key}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:1440}
    algorithm: HS256
  admin-email: ${APP_ADMIN_EMAIL:admin@example.com}

server:
  port: 8000

spring:
  application:
    name: strongtracking
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fitdb}
    username: ${SPRING_DATASOURCE_USERNAME:fituser}
    password: ${SPRING_DATASOURCE_PASSWORD:fitpass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-to-a-random-secret-key}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:1440}
    algorithm: HS256
  admin-email: ${APP_ADMIN_EMAIL:admin@example.com}
